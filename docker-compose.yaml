services:
  postgres:
    image: postgres
    container_name: companies-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: companies
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d companies"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
